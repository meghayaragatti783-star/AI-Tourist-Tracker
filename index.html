</div>

<script>

async function generateTrip() {

    const destination =
        document.getElementById("destination").value.trim();

    const days =
        document.getElementById("days").value.trim();

    const budget =
        document.getElementById("budget").value.trim();

    const selectedInterests =
        document.querySelectorAll('input[name="interest"]:checked');

    const interests =
        Array.from(selectedInterests).map(function(checkbox) {
            return checkbox.value;
        });


    // VALIDATION

    if (destination === "") {
        showError("Please enter your destination.");
        return;
    }

    if (days === "") {
        showError("Please enter the number of days.");
        return;
    }

    const numberOfDays = Number(days);

    if (
        !Number.isInteger(numberOfDays) ||
        numberOfDays < 1
    ) {
        showError(
            "Number of days must be a whole number greater than 0."
        );
        return;
    }

    if (numberOfDays > 30) {
        showError(
            "For now, please choose a maximum of 30 days."
        );
        return;
    }

    if (budget === "") {
        showError("Please enter your budget.");
        return;
    }

    const budgetAmount = Number(budget);

    if (
        !Number.isFinite(budgetAmount) ||
        budgetAmount <= 0
    ) {
        showError("Please enter a valid budget.");
        return;
    }

    if (interests.length === 0) {
        showError("Please choose at least one interest.");
        return;
    }


    // LOADING

    const result =
        document.getElementById("result");

    const button =
        document.getElementById("generateButton");

    button.disabled = true;

    button.innerHTML = `
        <span>⏳</span>
        Creating Your Trip...
        <span>✈️</span>
    `;

    result.innerHTML = `
        <div class="loading">
            <div class="loading-icon">✈️</div>

            <h2>Creating your adventure...</h2>

            <p>
                AI is preparing your travel itinerary.
            </p>

            <p>
                This may take a few seconds.
            </p>
        </div>
    `;


    // SEND REQUEST TO DEPLOYED BACKEND

    try {

        console.log("Sending request to backend...");

        const response =
            await fetch(
                "https://ai-tourist-tracker.onrender.com/plan",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({

                        destination: destination,

                        days: numberOfDays,

                        budget: budgetAmount,

                        interest: interests.join(", ")

                    })
                }
            );


        let data;

        try {

            data = await response.json();

        } catch {

            throw new Error(
                "Backend did not return valid JSON."
            );

        }


        console.log(
            "Backend response:",
            data
        );


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Something went wrong on the backend."
            );

        }


        if (
            !data.itinerary ||
            data.itinerary.trim() === ""
        ) {

            throw new Error(
                "No itinerary was returned."
            );

        }


        // CREATE DAY CARDS

        const itineraryHTML =
            createDayCards(
                data.itinerary
            );


        // DISPLAY RESULT

        result.innerHTML = `

            <div class="result-card">

                <div class="result-header">

                    <div>

                        <p class="result-small-title">
                            ✨ Your AI Travel Plan
                        </p>

                        <h2>
                            🌍 ${escapeHTML(
                                data.destination || destination
                            )}
                        </h2>

                    </div>

                </div>


                <div class="trip-info">

                    <div class="info-box">

                        <span>📅</span>

                        <div>

                            <small>
                                Duration
                            </small>

                            <strong>
                                ${data.days || numberOfDays} Days
                            </strong>

                        </div>

                    </div>


                    <div class="info-box">

                        <span>💰</span>

                        <div>

                            <small>
                                Budget
                            </small>

                            <strong>
                                ₹${Number(
                                    data.budget || budgetAmount
                                ).toLocaleString("en-IN")}
                            </strong>

                        </div>

                    </div>


                    <div class="info-box">

                        <span>❤️</span>

                        <div>

                            <small>
                                Interests
                            </small>

                            <strong>
                                ${escapeHTML(
                                    data.interest || interests.join(", ")
                                )}
                            </strong>

                        </div>

                    </div>

                </div>


                <h2 class="itinerary-title">
                    🗺️ Your Itinerary
                </h2>


                <div class="day-container">
                    ${itineraryHTML}
                </div>

            </div>

        `;

    }


    catch (error) {

        console.error(
            "ERROR:",
            error
        );

        showError(
            error.message ||
            "Unable to generate the trip."
        );

    }


    finally {

        button.disabled = false;

        button.innerHTML = `
            <span>✨</span>
            Generate My Trip
            <span>✈️</span>
        `;

    }

}


// CREATE DAY CARDS

function createDayCards(text) {

    const lines = text.split("\n");

    const days = [];

    let currentDay = null;


    for (let i = 0; i < lines.length; i++) {

        const line = lines[i].trim();

        if (line === "") {
            continue;
        }


        const dayMatch =
            line.match(
                /^(?:\*\*)?DAY\s+(\d+)(?:\*\*)?:?/i
            );


        if (dayMatch) {

            if (currentDay !== null) {

                days.push(currentDay);

            }


            currentDay = {

                number: dayMatch[1],

                content: []

            };

            continue;

        }


        if (currentDay !== null) {

            currentDay.content.push(line);

        }

    }


    if (currentDay !== null) {

        days.push(currentDay);

    }


    if (days.length === 0) {

        return `

            <div class="day-card">

                <div class="day-content">

                    ${formatText(text)}

                </div>

            </div>

        `;

    }


    let html = "";


    days.forEach(function(day) {

        html += `

            <div class="day-card">

                <div class="day-title">

                    <span class="day-number">
                        ${escapeHTML(day.number)}
                    </span>

                    <div>

                        <small>
                            TRAVEL DAY
                        </small>

                        <h3>
                            Day ${escapeHTML(day.number)}
                        </h3>

                    </div>

                </div>


                <div class="day-content">

                    ${formatText(
                        day.content.join("\n")
                    )}

                </div>

            </div>

        `;

    });


    return html;

}


// FORMAT AI TEXT

function formatText(text) {

    let html = escapeHTML(text);


    html =
        html.replace(
            /\*\*(.*?)\*\*/g,
            "<strong>$1</strong>"
        );


    html =
        html.replace(
            /^(Morning:|Afternoon:|Evening:|Food suggestions:|Estimated cost.*?:|TOTAL ESTIMATED BUDGET|TRAVEL TIPS)/gim,
            "<strong class='section-title'>$1</strong>"
        );


    html =
        html.replace(
            /^-\s+(.*)$/gm,
            "<div class='bullet'>• $1</div>"
        );


    html =
        html.replace(
            /\n/g,
            "<br>"
        );


    return html;

}


// SHOW ERROR

function showError(message) {

    document.getElementById("result").innerHTML = `

        <div class="error">

            <h3>
                ❌ Trip could not be generated
            </h3>

            <p>
                ${escapeHTML(message)}
            </p>

        </div>

    `;

}


// SECURITY

function escapeHTML(text) {

    return String(text)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}

</script>
